name: Security Audit

# Pentest B-11: pnpm audit berkala - dependensi bersih hari ini dengan margin
# tipis terhadap advisory react-router 2026; audit dijalankan tiap pakai
# dependensi harus sadar, bukan hanya saat deploy.

on:
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: pnpm audit (prod)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependensi produksi
        run: pnpm audit --prod

  notify:
    needs: [audit]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Kirim hasil CI ke Telegram
        uses: appleboy/telegram-action@v1.1.1
        with:
          token: ${{ secrets.TELEGRAM_TOKEN }}
          to: ${{ secrets.TELEGRAM_TO }}
          message: |
            ${{ contains(needs.*.result, 'failure') && '❌ Gagal' || (contains(needs.*.result, 'cancelled') && '⚠️ Dibatalkan' || '✅ Sukses') }} CI sambasku/web — Security Audit
            Branch: ${{ github.ref_name }} · Commit: ${{ github.sha }}
            https://github.com/sambasku/web/actions/runs/${{ github.run_id }}
      - name: Kirim hasil CI ke Discord
        if: always()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          STATUS: "${{ contains(needs.*.result, 'failure') && '❌ Gagal' || (contains(needs.*.result, 'cancelled') && '⚠️ Dibatalkan' || '✅ Sukses') }}"
          REPO: sambasku/web
          WORKFLOW: Security Audit
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          RUN_URL: "https://github.com/sambasku/web/actions/runs/${{ github.run_id }}"
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "Skip: DISCORD_WEBHOOK_URL tidak diset."
            exit 0
          fi
          MSG="$STATUS CI $REPO — $WORKFLOW
          Branch: $BRANCH · Commit: $SHA
          $RUN_URL"
          jq -n --arg content "$MSG" '{{content: $content}}' \
            | curl -sf -X POST -H 'Content-Type: application/json' \
                -d @- "$DISCORD_WEBHOOK_URL" \
            || echo "Discord webhook gagal (best-effort, job tidak gagal)"
