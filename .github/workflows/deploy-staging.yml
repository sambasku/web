name: Deploy Web (Staging)

# Deploy murni lewat CI/CD (GitHub Actions → wrangler deploy), BUKAN
# Cloudflare Pages. Web pakai Workers karena SSR (lihat docs/web/web-base-stack.md).
#
# Setup sekali di Cloudflare (manual):
#   1. Worker `sambasku-web-staging` dibuat otomatis oleh deploy pertama.
#   2. Attach custom domain: Workers & Pages → sambasku-web-staging →
#      Settings → Domains & Routes → add `sambasku-web-staging.iamutaki.com`.
#   3. Pastikan origin ini sudah ada di CORS_ALLOWED_ORIGINS API staging.

# Secrets repo (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   - izin "Workers Scripts: Edit" (BEDA kebutuhan
#                            dengan admin yang pakai "Cloudflare Pages: Edit";
#                            satu token boleh dua-duanya asal scoped begitu)
#   CLOUDFLARE_ACCOUNT_ID  - Account ID Cloudflare

on:
  push:
    branches: [staging]
  workflow_dispatch:

concurrency:
  group: deploy-web-staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # react-router build tidak menjalankan tsc, jadi typecheck eksplisit
      # di sini.
      - name: Typecheck
        run: pnpm typecheck

      # Pentest BH-05: CI tidak pernah menjalankan test sama sekali, sehingga
      # tidak ada yang menangkap regresi cache/header sebelum deploy. `pnpm
      # test` memakai node:test (tanpa dependency tambahan).
      - name: Unit test
        run: pnpm test

      # .env.staging TIDAK ter-track (gitignore) - nilai build di-inject
      # langsung di sini; Vite memberi process env prioritas tertinggi.
      # Nilai VITE_* memang publik (ter-embed di bundle JS) - aman inline.
      - name: Build (staging)
        run: pnpm build:staging
        env:
          VITE_API_BASE_URL: https://sambasku-staging.iamutaki.com/api/v1
          VITE_APP_URL: https://sambasku-web-staging.iamutaki.com
          VITE_APP_NAME: Kamus Sambas (Staging)

      # Config hasil build (dist/server/wrangler.json) dipakai, dengan
      # override --name agar tidak menimpa Worker produksi.
      - name: Deploy ke Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config dist/server/wrangler.json --name sambasku-web-staging

      # Pentest BH-01: `staging` sempat lint-red BERTAHAN, jadi tidak ada yang
      # pernah deploy ke sini - dan ini persis sebabnya remediasi G-01/G-02
      # menggantung. Karena staging adalah tujuan deploy pertama, ia wajib punya
      # gate yang sama dengan produksi.
      #
      # BH-05: yang diuji adalah PERILAKU cache, bukan hanya header. Request
      # kedua harus `hit` - itulah yang gagal diam-diam pada G-01/G-02.
      - name: Verifikasi perilaku cache live pasca-deploy
        run: |
          sleep 10
          ./scripts/assert-live-behavior.sh https://sambasku-web-staging.iamutaki.com staging

  notify:
    needs: [deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Kirim hasil CI ke Telegram
        uses: appleboy/telegram-action@v1.1.0
        with:
          token: ${{ secrets.TELEGRAM_TOKEN }}
          to: ${{ secrets.TELEGRAM_TO }}
          message: |
            ${{ contains(needs.*.result, 'failure') && '❌ Gagal' || (contains(needs.*.result, 'cancelled') && '⚠️ Dibatalkan' || '✅ Sukses') }} CI sambasku/web — Deploy Web (Staging)
            Branch: ${{ github.ref_name }} · Commit: ${{ github.sha }}
            https://github.com/sambasku/web/actions/runs/${{ github.run_id }}
      - name: Kirim hasil CI ke Discord
        if: always()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          STATUS: "${{ contains(needs.*.result, 'failure') && '❌ Gagal' || (contains(needs.*.result, 'cancelled') && '⚠️ Dibatalkan' || '✅ Sukses') }}"
          REPO: sambasku/web
          WORKFLOW: Deploy Web (Staging)
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          RUN_URL: "https://github.com/sambasku/web/actions/runs/${{ github.run_id }}"
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "Skip: DISCORD_WEBHOOK_URL tidak diset."
            exit 0
          fi
          MSG="$STATUS CI $REPO — $WORKFLOW
          Branch: $BRANCH · Commit: $SHA
          $RUN_URL"
          jq -n --arg content "$MSG" '{{content: $content}}' \
            | curl -sf -X POST -H 'Content-Type: application/json' \
                -d @- "$DISCORD_WEBHOOK_URL" \
            || echo "Discord webhook gagal (best-effort, job tidak gagal)"
